id: ep01_gukbap
title: 국밥에서 머리카락 나왔다며 10만 원 요구한 손님… CCTV 틀자 벌어진 일
thumbnail_text: 사장 나와! 근데…
location: 국밥집
twist_type: 증거
background_prompt: old traditional Korean gukbap restaurant interior, warm lighting, steaming bowls, wooden tables
characters:
- id: mansu
  name: 박만수
  role: villain
  gender: male
  age: 52
  look_prompt: Korean man in his 50s, bleached blond long bangs, thick gold necklace, shiny black jacket
- id: sunja
  name: 정순자
  role: hero
  gender: female
  age: 72
  look_prompt: Korean grandmother in her 70s, pure white hair in a low bun, floral apron, calm warm eyes
- id: minho
  name: 민호
